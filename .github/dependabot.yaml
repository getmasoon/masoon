version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[chore]"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "[chore]"
    groups:
      python-packages:
        patterns:
          - "*"
