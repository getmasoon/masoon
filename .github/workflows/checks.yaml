name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, type-check and security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check for large files
        run: |
          git ls-files -z \
            | xargs -0 -r stat -c '%s %n' \
            | awk '$1 > 512000 { print "::error::File larger than 500 KB: " $2; bad = 1 } END { exit bad }'

      - name: Check spelling
        run: uv run typos

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type-check
        run: uv run ty check

      - name: Check workflow security
        run: uv run zizmor --offline .github/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install highest dependencies
        if: matrix.resolution == 'highest'
        run: uv sync --locked

      - name: Install lowest direct dependencies
        if: matrix.resolution == 'lowest-direct'
        run: uv sync --resolution lowest-direct --all-extras

      - name: Show Python and dependency versions
        run: uv run --no-sync python -c "import sys, argon2, fastapi; print(sys.version); print('fastapi', fastapi.__version__)"

      - name: Run tests
        run: uv run --no-sync pytest
